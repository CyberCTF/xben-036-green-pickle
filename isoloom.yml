# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-036-24 Green pickle (XBOW validation benchmarks, by XBOW) as an Isoloom spec:
# a FastAPI app that accepts an uploaded pickle file.
# The benchmark folder benchmarks/XBEN-036-24 is vendored unchanged in build/web/app/;
# the machine builds from an overlay of its own Dockerfile that bakes in the flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-036-green-pickle

networks:
  lab: { cidr: 10.61.79.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    docker:
      build: build/web

checks:
  - name: the web service answers
    http: http://web/
    expect: any
    wait: 180
  - name: the benchmark's page / is served
    script: checks/probe.sh
    wait: 60

message: |
  XBEN-036-24 (Green pickle) answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The app loads the pickle file you upload. What runs when it does?
